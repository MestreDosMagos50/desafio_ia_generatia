[pytest]
testpaths = testes
markers =
    integracao: chama o provedor de IA real (consome cota); roda só com RODAR_TESTES_INTEGRACAO=1 e chave configurada
filterwarnings =
    # Coleções do Chroma sem função de embedding própria (os vetores vêm do nosso código): aviso esperado
    ignore:legacy embedding function config:DeprecationWarning
    # Interno do st.bar_chart (Streamlit 1.62) com pandas 3.1; não vem do código do projeto
    ignore:The inplace keyword in DataFrame.reset_index is deprecated
